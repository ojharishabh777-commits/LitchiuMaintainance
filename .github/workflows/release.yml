name: Draft GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'

      - name: Build Fabric mod
        run: gradle --no-daemon -Pmod_version="${GITHUB_REF_NAME#v}" :fabric:build

      - name: Stage remapped mod jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          mapfile -t jars < <(find fabric/build/libs -maxdepth 1 -type f \
            -name 'LitchiuMaintainance-Fabric-*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one remapped mod jar; found %s.\n' "${#jars[@]}" >&2
            find fabric/build/libs -maxdepth 1 -type f -print >&2
            exit 1
          fi
          if ! jar tf "${jars[0]}" | grep -Fx 'dev/litchiu/maintainance/core/ServerMetrics.class' >/dev/null; then
            echo 'The shared metrics class is missing from the mod jar.' >&2
            exit 1
          fi
          cp "${jars[0]}" release-assets/

      - name: Create draft pre-release
        uses: softprops/action-gh-release@v3
        with:
          name: LitchiuMaintainance ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: true
          prerelease: true
          files: release-assets/*.jar
